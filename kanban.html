<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Customiza Kanban | Funcionários</title>
    
    <link rel="icon" type="image/png" href="icon.png">

    <!-- Boxicons CDN -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="kanban.css">
</head>
<body>
    <div class="app-container">
        <!-- Header moderno -->
        <header class="kanban-header">
            <div class="logo-area">
                <i class='bx bxs-grid-alt'></i>
                <h1>Customiza Kanban</h1>
            </div>
            <div class="header-actions">
                <button id="addEmployeeBtn" class="btn-primary-glass">
                    <i class='bx bx-plus-circle'></i>
                    Novo Funcionário
                </button>
                <button id="exportExcelBtn" class="btn-secondary-glass">
                    <i class='bx bxs-file-export'></i>
                    Exportar
                </button>
                <button id="themeToggle" class="btn-secondary-glass">
                    <i class='bx bx-moon'></i>
                    Tema
                </button>
                <button id="logoutKanbanBtn" class="btn-secondary-glass">
                    <i class='bx bx-arrow-back'></i>
                    Sair
                </button>
            </div>
        </header>

        <!-- Kanban Board -->
        <div class="kanban-board" id="kanbanBoard"></div>
    </div>

    <!-- Botão de alternar tema (canto inferior direito) -->
    <button id="themeToggleFab" class="theme-toggle-bottom" aria-label="Alternar tema">
        <i class='bx bx-moon'></i>
    </button>

    <!-- Modal de adicionar/editar funcionário -->
    <div id="employeeModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Novo Funcionário</h3>
                <button class="modal-close-btn"><i class='bx bx-x'></i></button>
            </div>
            <form id="employeeForm">
                <div class="input-box">
                    <i class='bx bx-user'></i>
                    <input type="text" id="empNome" required placeholder="Nome completo *">
                </div>
                <div class="input-box">
                    <i class='bx bx-buildings'></i>
                    <input type="text" id="empPolo" placeholder="Polo (ex: Polo Industrial)">
                </div>
                <div class="input-box">
                    <i class='bx bx-calendar'></i>
                    <input type="date" id="empAdmissao" placeholder="Data de admissão">
                </div>
                <div class="input-box">
                    <i class='bx bx-time-five'></i>
                    <select id="empTurno" class="select-input">
                        <option value="">Selecione o turno</option>
                        <option value="Manhã">Manhã</option>
                        <option value="Tarde">Tarde</option>
                        <option value="Noite">Noite</option>
                        <option value="Integral">Integral</option>
                    </select>
                </div>
                <div class="input-row">
                    <div class="input-box half">
                        <i class='bx bx-time'></i>
                        <input type="time" id="empInicio" placeholder="Início expediente">
                    </div>
                    <div class="input-box half">
                        <i class='bx bx-time-five'></i>
                        <input type="time" id="empFim" placeholder="Término expediente">
                    </div>
                </div>

                <input type="hidden" id="editId" value="">
                <div class="modal-actions">
                    <button type="button" id="cancelModalBtn" class="btn-secondary">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de confirmação -->
    <div id="confirmModal" class="modal" style="display: none;">
        <div class="modal-content confirm-modal">
            <div class="confirm-icon">
                <i class='bx bx-question-mark'></i>
            </div>
            <p id="confirmMessage">Confirmar ação?</p>
            <div class="confirm-actions">
                <button id="confirmNo" class="btn-secondary">Não</button>
                <button id="confirmYes" class="btn-primary">Sim</button>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <div class="loading-text">Carregando...</div>
    </div>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script type="module" src="kanban.js"></script>
</body>
</html>
